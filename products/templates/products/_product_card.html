<div class="col-sm-6 col-lg-4">
    <article class="card catalog-card position-relative">
        {% if product.photo %}
            <img class="catalog-image" src="{{ product.photo.url }}" alt="Foto de {{ product.name }}">
        {% else %}
            <div class="catalog-placeholder" aria-hidden="true"><i class="bi bi-image"></i></div>
        {% endif %}
        <div class="card-body d-flex flex-column gap-3 p-4">
            <span class="catalog-category">{{ product.category.name }}</span>
            <h3 class="h5 fw-bold mb-0">{{ product.name }}</h3>
            <div class="d-flex align-items-center justify-content-between gap-2 mt-auto">
                <span class="text-primary fw-semibold">Ver detalhes <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
            </div>
            <a class="stretched-link catalog-link" href="{% url 'products:detail' product.pk %}" aria-label="Ver detalhes de {{ product.name }}"></a>
        </div>
    </article>
</div>
