name: Secret scanning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout completo para verificar o histórico
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recusar bancos, uploads e segredos rastreados
        run: python3 scripts/check_public_files.py
      - name: Verificar proteções de publicação
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Detectar segredos
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          globo_scan_dir="$(mktemp -d "$RUNNER_TEMP/globo-gitleaks.XXXXXX")"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$globo_scan_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $globo_scan_dir/gitleaks.tar.gz" \
            | sha256sum --check --status
          tar -xzf "$globo_scan_dir/gitleaks.tar.gz" -C "$globo_scan_dir" gitleaks
          "$globo_scan_dir/gitleaks" git . --config .gitleaks.toml \
            --redact --no-banner --log-opts="--all"
