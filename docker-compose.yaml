services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-globo_vidracaria}
      POSTGRES_USER: ${POSTGRES_USER:-globo_vidracaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env ou no ambiente}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-globo_vidracaria} -d ${POSTGRES_DB:-globo_vidracaria}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
